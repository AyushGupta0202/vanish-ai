name: Automated Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Get version from tag
        id: get_version
        if: github.event_name == 'push'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Set version from input
        id: set_version
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
      
      - name: Create Release Archive
        run: |
          mkdir -p release
          cp -r backend release/
          cp -r frontend/dist release/frontend
          cp Dockerfile docker-compose.yml start.sh release/
          cp README.md LICENSE release/ 2>/dev/null || true
          tar -czf vanish-ai-${{ steps.get_version.outputs.version || steps.set_version.outputs.version }}.tar.gz -C release .
          zip -r vanish-ai-${{ steps.get_version.outputs.version || steps.set_version.outputs.version }}.zip release/
      
      - name: Check for Release Drafter draft
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v${{ steps.get_version.outputs.version || steps.set_version.outputs.version }}';
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const draft = releases.find(r => r.tag_name === tag && r.draft);
            if (draft) {
              core.setOutput('draft_body', draft.body || '');
              core.setOutput('has_draft', 'true');
            } else {
              core.setOutput('has_draft', 'false');
            }
      
      - name: Generate Changelog
        id: changelog
        if: steps.draft.outputs.has_draft != 'true'
        uses: metcalfc/changelog-generator@v4.3.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
          excludeTypes: 'build,ci,docs,style,test,chore'
          outputFile: 'CHANGELOG.md'
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version || steps.set_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version || steps.set_version.outputs.version }}
          body: |
            ${{ steps.draft.outputs.draft_body != '' && steps.draft.outputs.draft_body || format('## 🚀 Release v{0}\n\n### 📦 Downloads\n- [Source Code (tar.gz)](https://github.com/{1}/archive/refs/tags/v{0}.tar.gz)\n- [Source Code (zip)](https://github.com/{1}/archive/refs/tags/v{0}.zip)\n\n### 📝 Changelog\n{2}\n\n### 🐳 Docker\n```bash\ndocker pull ghcr.io/{3}/vanish-ai:v{0}\n```', steps.get_version.outputs.version || steps.set_version.outputs.version, github.repository, steps.changelog.outputs.changelog, github.repository_owner) }}
          files: |
            vanish-ai-${{ steps.get_version.outputs.version || steps.set_version.outputs.version }}.tar.gz
            vanish-ai-${{ steps.get_version.outputs.version || steps.set_version.outputs.version }}.zip
          draft: false
          prerelease: false
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vanish-ai:latest
            ghcr.io/${{ github.repository_owner }}/vanish-ai:v${{ steps.get_version.outputs.version || steps.set_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

